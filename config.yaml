# Типы, которые не проверяются TCP-чеком (UDP/QUIC-протоколы).
udp_types:
  - hysteria2

services:
  ya_ru:
    url: "https://ya.ru/"
    expect_status: 200
    timeout_seconds: 7
  youtube:
    url: "https://www.youtube.com/generate_204"
    expect_status: 204
    timeout_seconds: 7
  instagram:
    url: "https://www.instagram.com/robots.txt"
    expect_status: 200
    timeout_seconds: 7
  telegram:
    url: "https://web.telegram.org/"
    expect_status: 200
    timeout_seconds: 7
  chatgpt:
    url: "https://chatgpt.com/cdn-cgi/trace"
    expect_status: 200
    timeout_seconds: 7
  flashscore:
    url: "https://www.flashscorekz.com/"
    expect_status: 200
    timeout_seconds: 7

schedule:
  update_interval_minutes: 60

http_server:
  host: "0.0.0.0"
  port: 8080

tcp_check:
  concurrent: 200
  timeout_seconds: 4

service_check:
  concurrent_pc: 6
  concurrent_github: 8
  retry_on_connect_error: true

speed_test:
  concurrent_pc: 6
  concurrent_github: 8
  test_urls:
    # Google CDN (dl.google.com) — ближе всего к серверам YouTube
    - "https://dl.google.com/dl/android/studio/install/3.5.2.0/android-studio-ide-191.5977832-windows.exe"
    - "https://speed.cloudflare.com/__down?bytes=10000000"
  timeout_seconds: 40
  retest_count: 2
  retest_pause_seconds: 2
  min_measure_bytes: 5000000
  peak_window_seconds: 0.5

cache:
  enabled: true
  ban_after_consecutive_failures: 3
  ban_duration_hours: 2
  cache_file: "out/cache.json"

paths:
  out_subscription: "out/subscription.yaml"
  out_results: "out/results.json"
  log_file: "logs/app.log"