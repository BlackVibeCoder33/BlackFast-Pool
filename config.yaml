thresholds:
  max_ping_ms: 400
  min_speed_mbps: 3
  # Максимальная задержка до сервиса (мс). Подняли с 2000 до 2500:
  # excluded_by_latency вырос с 8 до 18 за прогон, режем «ещё живые» серверы.
  max_service_latency_ms: 2500

# Переопределение порогов для конкретных типов прокси.
thresholds_by_type:
  hysteria2:
    max_service_latency_ms: 2000

# Сколько вариантов одного сервера с РАЗНЫМИ client-fingerprint
# отдавать в подписку. 1 = только протестированный representative
# (старое поведение). 3 = rep + до 2 «запасных» fp: если DPI забанит
# один отпечаток, клиент переберёт остальные.
# Тесты (TCP/service/speed) идут только по representative.
dedupe:
  max_fp_variants: 3

anti_dpi:
  enabled: true
  fragment: true
  fragment_fallback_delay: "500ms"
  record_fragment: true    

