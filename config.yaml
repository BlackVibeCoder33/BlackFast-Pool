# Типы, которые не проверяются TCP-чеком (UDP/QUIC-протоколы).
udp_types:
  - hysteria2

services:
  youtube:
    url: "https://www.youtube.com/generate_204"
    expect_status: 204
    timeout_seconds: 5
  instagram:
    url: "https://www.instagram.com/robots.txt"
    expect_status: 200
    timeout_seconds: 5
  telegram:
    url: "https://web.telegram.org/"
    expect_status: 200
    timeout_seconds: 5
  chatgpt:
    url: "https://chatgpt.com/cdn-cgi/trace"
    expect_status: 200
    timeout_seconds: 5
  flashscore:
    url: "https://www.flashscorekz.com/"
    expect_status: 200
    timeout_seconds: 5

schedule:
  update_interval_minutes: 60

http_server:
  host: "0.0.0.0"
  port: 8080

tcp_check:
  concurrent: 100
  timeout_seconds: 4

service_check:
  concurrent_pc: 12
  concurrent_github: 8
  retry_on_connect_error: true

speed_test:
  concurrent_pc: 4
  concurrent_github: 8
  test_urls:
    - "https://dl.google.com/android/repository/platform-28_r06.zip"
    - "https://speed.cloudflare.com/__down?bytes=10000000"
    - "https://speed.cloudflare.com/__down?bytes=25000000"
  timeout_seconds: 45
  retest_count: 2
  retest_pause_seconds: 2
  min_measure_bytes: 1000000
  peak_window_seconds: 0.3

cache:
  enabled: true
  ban_after_consecutive_failures: 3
  ban_duration_hours: 2
  cache_file: "out/cache.json"

paths:
  out_subscription: "out/subscription.yaml"
  out_results: "out/results.json"
  log_file: "logs/app.log"