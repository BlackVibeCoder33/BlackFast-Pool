  - name: "hamedcode-vless"
    url: "https://raw.githubusercontent.com/hamedcode/port-based-v2ray-configs/main/sub/vless.txt"
    enabled: true

thresholds:
  max_ping_ms: 400
  min_speed_mbps: 3
  # Максимальная задержка до сервиса (мс).
  max_service_latency_ms: 2500

# Переопределение порогов для конкретных типов прокси.
thresholds_by_type:
  hysteria2:
    max_service_latency_ms: 2000

# Сколько вариантов одного сервера с РАЗНЫМИ client-fingerprint
# отдавать в подписку. 1 = только representative. 3 = representative
# + до 2 «запасных» fp: если один отпечаток заблокирован,
# клиент переберёт остальные. Тесты (TCP/service/speed) идут
# только по representative.
dedupe:
  max_fp_variants: 3

anti_dpi:
  enabled: true
  fragment: true
  fragment_fallback_delay: "500ms"
  record_fragment: true    

