# ============================================================
# Конфиг Karing Pool Builder
# ============================================================

subscriptions:
  # --- IGARECK (Clash YAML) ---
  - name: "igareck-VLESS-mobile"
    url: "https://raw.githack.com/igareck/vpn-configs-for-russia/main/Export/Clash/RU_DIRECT/BLACK_VLESS_RUS_mobile_clash_rudirect.yaml"
    enabled: true
  - name: "igareck-VLESS"
    url: "https://raw.githack.com/igareck/vpn-configs-for-russia/main/Export/Clash/RU_DIRECT/BLACK_VLESS_RUS_clash_rudirect.yaml"
    enabled: true
  - name: "igareck-SS-All"
    url: "https://raw.githack.com/igareck/vpn-configs-for-russia/main/Export/Clash/RU_DIRECT/BLACK_SS%2BAll_RUS_clash_rudirect.yaml"
    enabled: true
  # --- KIZYAK ---
  - name: "kizyak-beta6BL"
    url: "https://raw.githubusercontent.com/Maskkost93/kizyak-vpn-4.0/main/kizyakbeta6BL.txt"
    enabled: true
  - name: "kizyak-beta6"
    url: "https://raw.githubusercontent.com/Maskkost93/kizyak-vpn-4.0/main/kizyakbeta6.txt"
    enabled: true
  - name: "kizyak-beta7"
    url: "https://raw.githubusercontent.com/Maskkost93/kizyak-vpn-4.0/main/kizyakbeta7.txt"
    enabled: true
  # --- WLUNLOCKER ---
  - name: "wlunlocker-blacklist"
    url: "https://raw.githubusercontent.com/wlunlocker/vpn-configs/main/blacklist_all.txt"
    enabled: true
    

thresholds:
  max_ping_ms: 400
  min_speed_mbps: 3
  required_services:
    - youtube
    - telegram
    - instagram

anti_dpi:
  enabled: true
  fragment: true
  fragment_fallback_delay: "500ms"
  record_fragment: true    

subscription_profiles:
  - name: "BlackFast TG+YT"
    path: "tg-yt"
    filename: "Global-BlackFast-TG-YT.yaml"
    group_prefix: "BlackFast TG+YT"
    required_services:
      - telegram
      - youtube
  - name: "BlackFast TG+YT+IG"
    path: "tg-yt-ig"
    filename: "Global-BlackFast-TG-YT-IG.yaml"
    group_prefix: "BlackFast TG+YT+IG"
    required_services:
      - telegram
      - youtube
      - instagram
  - name: "BlackFast FlashScore"
    path: "flashscore"
    filename: "Global-BlackFast-FlashScore.yaml"
    group_prefix: "BlackFast FlashScore"
    required_services:
      - flashscore
  - name: "BlackFast LS"
    path: "ls"
    filename: "Global-BlackFast-LS.yaml"
    group_prefix: "BlackFast LS"
    required_services:
      - telegram
      - youtube
      - instagram
    min_speed_mbps: 0.5
  - name: "BlackFast TG+YT LS"
    path: "tg-yt-ls"
    filename: "Global-BlackFast-TG-YT-LS.yaml"
    group_prefix: "BlackFast TG+YT LS"
    required_services:
      - telegram
      - youtube
    min_speed_mbps: 0.5
  - name: "BlackFast TG+YT+IG LS"
    path: "tg-yt-ig-ls"
    filename: "Global-BlackFast-TG-YT-IG-LS.yaml"
    group_prefix: "BlackFast TG+YT+IG LS"
    required_services:
      - telegram
      - youtube
      - instagram
    min_speed_mbps: 0.5
  - name: "BlackFast FlashScore LS"
    path: "flashscore-ls"
    filename: "Global-BlackFast-FlashScore-LS.yaml"
    group_prefix: "BlackFast FlashScore LS"
    required_services:
      - flashscore
    min_speed_mbps: 0.5

services:
  youtube:
    url: "https://i.ytimg.com/generate_204"
    expect_status: 204
    timeout_seconds: 7
  instagram:
    url: "https://www.instagram.com/robots.txt"
    expect_status: 200
    timeout_seconds: 7
  telegram:
    url: "https://web.telegram.org/"
    expect_status: 200
    timeout_seconds: 7
  flashscore:
    url: "https://www.flashscorekz.com/"
    expect_status: 200
    timeout_seconds: 7

schedule:
  update_interval_minutes: 45

http_server:
  host: "0.0.0.0"
  port: 8080

tcp_check:
  concurrent: 200
  timeout_seconds: 4

service_check:
  concurrent_pc: 6
  concurrent_github: 8
  retry_on_connect_error: true

speed_test:
  concurrent_pc: 6
  concurrent_github: 8
  test_urls:
    - "https://speed.cloudflare.com/__down?bytes=2000000"
    - "https://speed.cloudflare.com/__down?bytes=1000000"
    - "https://speed.cloudflare.com/__down?bytes=500000"
  timeout_seconds: 20
  retest_count: 2
  retest_pause_seconds: 2
  min_measure_bytes: 300000
  peak_window_seconds: 0.5

cache:
  enabled: true
  ban_after_consecutive_failures: 3
  ban_duration_hours: 2
  cache_file: "out/cache.json"

paths:
  out_subscription: "out/subscription.yaml"
  out_results: "out/results.json"
  log_file: "logs/app.log"