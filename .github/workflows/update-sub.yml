name: Update BlackFast Subscription

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download sing-box
        run: |
          mkdir -p bin
          ASSET_URL=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -oP '"browser_download_url":\s*"\K[^"]*linux-amd64\.tar\.gz(?=")' \
            | head -1)
          echo "Asset URL: ${ASSET_URL}"
          if [ -z "${ASSET_URL}" ]; then
            echo "ERROR: не удалось получить URL релиза sing-box"
            exit 1
          fi
          curl -fL -o singbox.tar.gz "${ASSET_URL}"
          file singbox.tar.gz
          tar -xzf singbox.tar.gz
          SINGBOX_BIN=$(find . -type f -name "sing-box" | head -1)
          echo "Found binary: ${SINGBOX_BIN}"
          if [ -z "${SINGBOX_BIN}" ]; then
            echo "ERROR: бинарник sing-box не найден после распаковки"
            find . -type f | head -20
            exit 1
          fi
          mv "${SINGBOX_BIN}" bin/sing-box
          chmod +x bin/sing-box
          rm -rf singbox.tar.gz sing-box-*-linux-amd64*

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: out/cache.json
          key: blackfast-cache-${{ github.run_id }}
          restore-keys: |
            blackfast-cache-

      - name: Run pipeline
        run: python run_once.py

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: out/cache.json
          key: blackfast-cache-${{ github.run_id }}

      - name: Upload subscription artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackfast-subscription
          path: |
            out/Global-*.yaml
            out/Hiddify-*.txt
            out/stats.json
          if-no-files-found: warn

      - name: Update Gist (all profiles)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python scripts/update_gist.py

      - name: Publish pipeline logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -d logs ] || [ -z "$(ls -A logs 2>/dev/null)" ]; then
            echo "No logs to publish"
            exit 0
          fi
          git add logs/
          if git diff --cached --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "chore: update pipeline logs [skip ci]"
          git push
